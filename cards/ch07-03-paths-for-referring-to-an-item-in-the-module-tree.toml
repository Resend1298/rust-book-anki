[[cards]]
id = "127ace8f-731e-4ea9-be5e-e6dc85287103"
type = "cloze"
text = '''
absolute path从crate root开始：

- 当前crate中的以{{c1::`crate`}}开头
- 外部crate中的以{{c2::那个crate的名字}}开头
'''

[[cards]]
id = "6d4be412-aeb8-4fa4-86c2-0d9295119a05"
type = "basic"
front = '''
relative path可以以什么开头？
'''
back = '''
`self`、`super`，或直接写名字（也即省略`self::`）。
'''

[[cards]]
id = "6f095b45-8a1c-4486-bea8-f4a6e5b8331d"
type = "basic"
front = '''
Rust中的东西默认是public还是private？
'''
back = '''
private。
'''

[[cards]]
id = "c96358ea-129a-4348-b8f3-b2afacf287b4"
type = "basic"
front = '''
子module默认能使用父module中的private东西吗？
'''
back = '''
能。
'''

[[cards]]
id = "4d7d7e43-3c54-4950-9d2c-bf62dfe17dcc"
type = "basic"
front = '''
同一个module中定义的东西互相访问，需要`pub`吗？
'''
back = '''
不需要。
'''

[[cards]]
id = "e52be132-595b-4159-8f7d-b6b1a9067229"
type = "basic"
front = '''
给module加上`pub`，其中的东西也会变成public吗？
'''
back = '''
不会。`pub mod`只公开module本身，其中的东西要各自加`pub`。
'''

[[cards]]
id = "453121b8-ba99-484f-b440-b1a58e32698b"
type = "basic"
front = '''
`pub struct`的field默认是public吗？
'''
back = '''
不是，每个field要单独加`pub`。
'''

[[cards]]
id = "090ce3f2-b873-427e-84f8-cb27548a0eea"
type = "basic"
front = '''
`pub enum`的variant默认是public吗？
'''
back = '''
是。
'''

[[cards]]
id = "d845e734-e9c5-43b2-b076-dd3310524613"
type = "basic"
front = '''
struct有private field时，外部代码怎样创建它的instance？
'''
back = '''
必须通过 struct 提供的函数。
'''
