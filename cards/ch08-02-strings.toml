type = "cloze"
text = '''
遍历字符串中的每个 char 用 {{c1::`s.chars()`}}，遍历每个 byte 用 {{c2::`s.bytes()`}}。
'''

[[cards]]
id = "b9391638-5aca-47f4-a03c-ace9f4e0ecdf"
type = "basic"
front = '''
用 `&s[a..b]` 取 string slice 时，`a` 和 `b` 以什么为单位？
'''
back = '''
byte。
'''
