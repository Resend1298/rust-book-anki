[[cards]]
id = "130de13e-9d5f-42c6-a9aa-996dd58711c3"
type = "basic"
front = '''
crate是什么？
'''
back = '''
Rust编译器一次编译的最小代码单位。
（直接用`rustc`编译单个`.rs`文件时，这个文件就是一个crate。）
'''

[[cards]]
id = "305798a7-8303-4086-91fc-40ec6b19a3a8"
type = "basic"
front = '''
binary crate和library crate有什么区别？
'''
back = '''
binary crate编译成可执行文件，必须有`main`函数。
library crate不生成可执行文件，不需要`main`。
'''

[[cards]]
id = "54f59ea7-d501-412b-b5d8-5d00e94ccc71"
type = "basic"
front = '''
crate root是什么？
'''
back = '''
编译器编译crate时开始的源文件，它构成crate的root module。
'''

[[cards]]
id = "c767844c-1ce6-4fbc-a5f5-de28fd56820b"
type = "basic"
front = '''
package是什么？
'''
back = '''
一个或多个crate的集合，用`Cargo.toml`描述如何构建它们。
'''

[[cards]]
id = "28be734f-48b4-4097-a172-173b0bbb737d"
type = "cloze"
text = '''
一个package可以包含{{c1::任意多个}} binary crate，{{c2::最多一个}} library crate，并且{{c3::至少要有一个}} crate。
'''

[[cards]]
id = "f3f2d422-7488-4e04-bfca-11aca0a874c6"
type = "cloze"
text = '''
按照Cargo的约定，{{c1::`src/main.rs`}}是binary crate的crate root，{{c2::`src/lib.rs`}}是library crate的crate root。
'''

[[cards]]
id = "7b046798-d33d-41ea-b0b2-265823aafd68"
type = "basic"
front = '''
Cargo按约定从`src/main.rs`或`src/lib.rs`构建的crate叫什么名字？
'''
back = '''
与package同名。
'''

[[cards]]
id = "2accace0-587c-4d8c-bc23-0414a688dd27"
type = "basic"
front = '''
如何让一个package包含多个binary crate？
'''
back = '''
把源文件放在`src/bin/`目录下，每个文件是一个单独的binary crate。
'''
