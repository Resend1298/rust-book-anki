[[cards]]
id = "ebad3a16-60f7-4c9c-826c-3169f08bb9b9"
type = "basic"
front = '''
`Poll<T>`有哪些variant，各表示什么？
'''
back = '''
- `Ready(T)`：future已完成，结果为`T`
- `Pending`：还没完成，之后需要再检查
'''

[[cards]]
id = "b2b782ed-ca14-4880-a703-4e922d011c8c"
type = "basic"
front = '''
`.await`在底层是怎么工作的？
'''
back = '''
调用future的`poll`。
返回`Pending`时，之后再回来poll，直到返回`Ready`。
'''

[[cards]]
id = "9bb6a43a-de49-42c2-82e5-3bda5d30242e"
type = "basic"
front = '''
两个类型相同的async block，它们的future类型相同吗？
'''
back = '''
不同。
编译器为每个async block生成一个独特的匿名类型。
'''

[[cards]]
id = "21b30e7b-94c8-4fd0-a8f2-314612030263"
type = "basic"
front = '''
如何等待一个集合中的所有future完成？
'''
back = '''
`futures::future::join_all(futs).await`
返回由各个future的输出组成的`Vec`。
'''

[[cards]]
id = "7c008ab2-c249-4229-8d21-54b983130765"
type = "basic"
front = '''
`Pin`有什么作用？
'''
back = '''
包装一个pointer，保证它指向的值不会在内存中被移动，除非这个值的类型实现了`Unpin`。
'''

[[cards]]
id = "b2c64eb4-f249-4628-8799-0658d003b9ba"
type = "basic"
front = '''
`Pin<Box<T>>`固定住的是`Box`还是`T`？
'''
back = '''
`T`。`Box`本身可以随意移动。
'''

[[cards]]
id = "5d4865d9-206a-4077-8101-a87f20c1447f"
type = "basic"
front = '''
为什么future开始被poll时，它必须被pin？
'''
back = '''
async block生成的state machine可能包含指向自身的reference。
'''

[[cards]]
id = "f055d707-dba1-499b-b1e9-ac80b42f9d36"
type = "basic"
front = '''
`Unpin` trait表示什么？
'''
back = '''
这个类型的值可以安全地在内存中被移动。
'''

[[cards]]
id = "da7a4ddc-49dd-4aa2-8f46-24c0f4ee8b74"
type = "basic"
front = '''
哪些类型实现了`Unpin`？
'''
back = '''
绝大多数类型都实现了`Unpin`。
典型没有实现的包括async block和async function产生的future。
'''

[[cards]]
id = "7ca89829-0dd5-48e0-94e4-e2c720cf25b0"
type = "basic"
front = '''
`std::pin::pin!`和`Box::pin`有什么区别？
'''
back = '''
- `std::pin::pin!(v)`：就地pin，不分配heap，得到`Pin<&mut T>`，只能在当前scope使用
- `Box::pin(v)`：在heap上pin，得到`Pin<Box<T>>`，可以离开当前scope使用
'''

[[cards]]
id = "8e3e9d51-d79b-4c98-88b5-049cd56b02b8"
type = "basic"
front = '''
为什么直接`.await`一个future时，不需要手动pin它？
'''
back = '''
`.await`会自动pin它。
'''
