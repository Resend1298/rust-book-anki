[[cards]]
id = "9674833b-7919-4805-9292-678dfa6adb2e"
type = "basic"
front = '''
什么是interior mutability？
'''
back = '''
即使只有immutable reference，也能修改数据的设计模式。
'''

[[cards]]
id = "beb4f1b1-43a0-49fe-8e75-6128d71ebf8e"
type = "basic"
front = '''
使用interior mutability的类型，内部靠什么绕过borrowing rule？
'''
back = '''
`unsafe` code，再包装成safe API对外提供。
'''

[[cards]]
id = "56bc77b5-255f-4ecd-99dc-97b07e220063"
type = "cloze"
text = '''
`Box<T>`、`Rc<T>`、`RefCell<T>`的区别：

- {{c1::`Rc<T>`}}允许同一数据有多个owner；`Box<T>`和`RefCell<T>`只有一个owner。
- `Box<T>`允许{{c2::编译时检查的immutable或mutable borrow}}。
- `Rc<T>`只允许{{c3::编译时检查的immutable borrow}}。
- `RefCell<T>`允许{{c4::运行时检查的immutable或mutable borrow}}。
'''

[[cards]]
id = "1d1f80c7-ad9c-4548-9c5d-5e374fa91e57"
type = "basic"
front = '''
`RefCell<T>`违反borrowing rule会怎样？
'''
back = '''
运行时panic，而不是编译错误。
'''

[[cards]]
id = "5844ecf3-39c1-4ffc-b058-2c4fbfcbd2c5"
type = "basic"
front = '''
编译时已经能检查borrowing rule，为什么还需要运行时检查？
'''
back = '''
编译器的静态分析是保守的，会拒绝一些实际上正确的程序。
'''

[[cards]]
id = "dffc6b2c-ac3d-43f2-8baf-6a89ec3ad291"
type = "basic"
front = '''
在运行时检查borrowing rule有什么缺点？
'''
back = '''
- 错误发现得更晚，可能到上线后才暴露
- 有少量运行时开销
'''

[[cards]]
id = "f8a30586-472f-4a49-bde1-0c27312b9e2a"
type = "basic"
front = '''
如何获取`RefCell<T>`中值的immutable reference？
'''
back = '''
`.borrow()`，返回smart pointer `Ref<T>`。
'''

[[cards]]
id = "c1739d8c-7487-4b61-acc1-28062651b633"
type = "basic"
front = '''
如何获取`RefCell<T>`中值的mutable reference？
'''
back = '''
`.borrow_mut()`，返回smart pointer `RefMut<T>`。
'''

[[cards]]
id = "defdad9a-83e3-4097-a107-5be372008c80"
type = "basic"
front = '''
`RefCell<T>`如何在运行时检查borrowing rule？
'''
back = '''
记录当前有多少个`Ref<T>`和`RefMut<T>`还活着。
'''

[[cards]]
id = "be86fe10-2ad4-42e7-93e3-20b7cc90bc2d"
type = "basic"
front = '''
实现mock object时，trait method只接收`&self`，如何记录调用？
'''
back = '''
把记录放进`RefCell<T>`，用`.borrow_mut()`修改。
'''

[[cards]]
id = "12795407-67e1-43ff-97a6-51fb23fc74bc"
type = "basic"
front = '''
`Rc<RefCell<T>>`有什么用？
'''
back = '''
让数据既有多个owner，又可以修改。
'''

[[cards]]
id = "19b633c3-4175-47fa-b658-9c1229c4b781"
type = "basic"
front = '''
`RefCell<T>`能在多个thread之间共享吗？
'''
back = '''
不能，会编译错误。多线程中要用`Mutex<T>`。
'''
