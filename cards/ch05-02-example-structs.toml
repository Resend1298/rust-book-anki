[[cards]]
id = "fae708ac-fe13-45ab-93df-104625f67061"
type = "basic"
front = '''
用`println!`的`{}`打印自定义struct时，这个类型需要实现哪个trait？
'''
back = '''
`Display`。struct该怎样展示并不明确，所以Rust不会为自定义struct自动实现它。
'''

[[cards]]
id = "58d938b2-e1a6-4515-8464-d8a627ee580a"
type = "basic"
front = '''
`println!`中的`{:?}`使用哪种输出格式？
'''
back = '''
`Debug`
'''

[[cards]]
id = "bbe4f814-b828-4494-8640-bd992dafc2db"
type = "basic"
front = '''
如何让自定义的struct可以用`{:?}`打印？
'''
back = '''
在struct定义前加`#[derive(Debug)]`。
'''

[[cards]]
id = "f8bb72f8-7232-46a0-8bd7-457c68e42d44"
type = "basic"
front = '''
`{:?}`和`{:#?}`有什么区别？
'''
back = '''
`{:#?}`是pretty-print的`Debug`格式，更易读。
derive生成的`Debug`会让每个field单独一行。
'''

[[cards]]
id = "5d9207d8-cc4b-461b-a468-318e404870c2"
type = "basic"
front = '''
`dbg!`会打印哪些信息？
'''
back = '''
调用处的位置，表达式本身，以及表达式的值（`{:#?}`格式）。
'''

[[cards]]
id = "7dbb7a02-2d0c-4e0b-bf4e-4b1183c6777d"
type = "basic"
front = '''
`dbg!`和`println!`分别输出到哪里？
'''
back = '''
`dbg!`输出到stderr，`println!`输出到stdout。
'''

[[cards]]
id = "0dac8471-3346-49bd-8040-855e4369b541"
type = "basic"
front = '''
`dbg!`如何处理传入值的ownership？
'''
back = '''
取得ownership，打印后再把值返回。
所以可以把`dbg!`包在表达式外面，而不影响表达式的结果。
'''
