[[cards]]
id = "46c05d42-2b39-4e0f-9b9d-c5e1cf9cf2d4"
type = "basic"
front = '''
`isize` 和 `usize` 占多少位？
'''
back = '''
取决于计算机架构：64 位架构上是 64 位，32 位架构上是 32 位。
'''

[[cards]]
id = "8ccda7fc-ee61-4371-a7c8-2766ceafbeea"
type = "basic"
front = '''
`usize` 最主要用在什么场景？
'''
back = '''
作为集合的索引。例如 array 的索引必须是 `usize`。
'''

[[cards]]
id = "ab2042f2-cf72-4238-8d96-6c54dc4d2a87"
type = "basic"
front = '''
没有其他约束时，整数字面量默认是什么类型？
'''
back = '''
`i32`
'''

[[cards]]
id = "63775ce7-c1a5-4a17-bdd7-57bed82a9a7e"
type = "basic"
front = '''
没有其他约束时，浮点数字面量默认是什么类型？
'''
back = '''
`f64`。在现代 CPU 上它和 `f32` 速度差不多，但精度更高。
'''

[[cards]]
id = "444a1e7b-5542-4114-b335-77a9f195a4db"
type = "basic"
front = '''
如何直接在数字字面量上指定类型，比如让 `57` 是 `u8`？
'''
back = '''
加类型后缀：`57u8`
'''

[[cards]]
id = "71c69b27-3fd6-4cec-b9ca-7bfdc0f0f4f2"
type = "basic"
front = '''
数字字面量 `1_000` 中的 `_` 有什么作用？
'''
back = '''
只是视觉分隔符，不影响值。`1_000` 等于 `1000`。
'''

[[cards]]
id = "2be121ba-8504-4a74-89c2-dea2e05fc60c"
type = "basic"
front = '''
Rust 中八进制整数字面量的前缀是什么？
'''
back = '''
`0o`，如 `0o77`。以 `0` 开头的 `077` 仍是十进制的 77。
'''

[[cards]]
id = "025c80c6-7eb4-46c9-bcd2-e63ea1a840ea"
type = "basic"
front = '''
`b'A'` 是什么类型的值？
'''
back = '''
`u8`，值为 `A` 的 ASCII 码 65。
'''

[[cards]]
id = "0a59352c-3f0a-4fd3-a12e-22b009096c7b"
type = "cloze"
text = '''
整数运算在运行时溢出时，默认配置下，debug 模式会 {{c1::panic}}；release 模式会 {{c2::溢出}}。
'''
extra = '''
编译时就能看出的溢出，会直接编译报错。
'''

[[cards]]
id = "8caccd16-311c-408d-bb96-189d181cf133"
type = "basic"
front = '''
`-7 / 2` 的结果是多少？
'''
back = '''
`-3`。整数除法向零截断。
'''

[[cards]]
id = "18fb05ed-d63c-455f-a4a1-fe850bd64067"
type = "basic"
front = '''
Rust 的 `char` 占多少 byte？
'''
back = '''
4 byte。它表示一个 Unicode scalar value，而不只是 ASCII 字符。
'''

[[cards]]
id = "1c2aa3bf-ca03-48ee-b013-821559ae46e2"
type = "basic"
front = '''
Rust 中 `char` 字面量和字符串字面量分别用什么引号？
'''
back = '''
`char` 用单引号，字符串用双引号。
'''

[[cards]]
id = "5a756e01-45cb-46da-8bfa-918c98d59e0a"
type = "basic"
front = '''
tuple 和 array 在元素类型上有什么区别？
'''
back = '''
tuple 的元素可以是不同类型；array 的元素必须是同一类型。
'''

[[cards]]
id = "ca0dad64-8077-4035-9096-f3b28b3fe892"
type = "basic"
front = '''
如何把一个三元素的 tuple `tup` 拆成三个变量 `x`、`y`、`z`？
'''
back = '''
`let (x, y, z) = tup;`，这叫 destructuring。
'''

[[cards]]
id = "e50a0417-26a8-40dc-a626-74ec02ff9878"
type = "basic"
front = '''
如何访问 tuple `tup` 的第一个元素？
'''
back = '''
`tup.0`
'''

[[cards]]
id = "4c007f2c-8841-4a43-9412-a1107a4563d2"
type = "basic"
front = '''
不含任何值的 tuple `()` 叫什么？
'''
back = '''
unit。它的值和类型都写作 `()`，表示空值或空的返回类型。
'''

[[cards]]
id = "e8aea3b2-d90a-4edd-8d34-279af5adb2f6"
type = "basic"
front = '''
没有声明返回类型的函数，返回值是什么？
'''
back = '''
unit 值 `()`。
'''

[[cards]]
id = "e652c004-0f25-441f-ae79-af4bab1cc89c"
type = "basic"
front = '''
array 和 vector 的主要区别是什么？
'''
back = '''
array 长度固定，分配在 stack 上；vector 长度可变，存放在 heap 上。
'''

[[cards]]
id = "dfa35e40-15cd-4225-b1d6-588a78450b24"
type = "basic"
front = '''
包含 5 个 `i32` 的 array，类型怎么写？
'''
back = '''
`[i32; 5]`
'''

[[cards]]
id = "629fbafa-aaf8-48e4-9048-68900f2d2720"
type = "basic"
front = '''
如何简洁地创建一个包含 5 个 x 的 array？
'''
back = '''
`[x; 5]`
'''

[[cards]]
id = "2ee45495-1183-4396-aa39-1dc37ba69c2c"
type = "basic"
front = '''
用运行时才确定的越界索引访问 array，会怎样？
'''
back = '''
panic。Rust 在运行时检查索引是否小于长度，而不是去访问无效内存。
'''
